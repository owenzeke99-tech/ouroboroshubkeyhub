
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09050a">
<title>Ouroboros Hub Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --pink: #ff91c8;
    --pink-light: #ffd2e9;
    --pink-deep: #e64f9c;
    --black: #09050a;
    --panel: rgba(19, 12, 19, .94);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 22px;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at 50% 35%, #351329 0%, transparent 48%),
        radial-gradient(ellipse at 10% 90%, #21101d 0%, transparent 40%),
        var(--black);
    color: #fff;
    font-family: 'Inter', sans-serif;
}

#particles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.ambient {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: var(--pink-deep);
    filter: blur(140px);
    opacity: .12;
    pointer-events: none;
    animation: ambient 8s ease-in-out infinite alternate;
}

.ambient.one {
    top: -150px;
    left: -120px;
}

.ambient.two {
    right: -130px;
    bottom: -170px;
    animation-delay: -4s;
}

.card {
    position: relative;
    z-index: 1;
    isolation: isolate;
    width: 100%;
    max-width: 445px;
    padding: 34px 27px 27px;
    overflow: hidden;
    border: 1px solid rgba(255, 145, 200, .32);
    border-radius: 25px;
    background: var(--panel);
    backdrop-filter: blur(22px);
    box-shadow:
        0 0 60px rgba(230, 79, 156, .10),
        inset 0 0 35px rgba(255, 145, 200, .035);
    animation: entrance .85s cubic-bezier(.2,.8,.2,1) both;
    transition: box-shadow .4s, border-color .4s;
}

.card:hover {
    border-color: rgba(255, 145, 200, .65);
    box-shadow:
        0 0 75px rgba(230, 79, 156, .18),
        inset 0 0 40px rgba(255, 145, 200, .055);
}

.card::before {
    content: "";
    position: absolute;
    z-index: -1;
    top: 0;
    left: -100%;
    width: 70%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #fff, var(--pink), transparent);
    box-shadow: 0 0 20px var(--pink);
    animation: scan 4s linear infinite;
}

.card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(
        125deg,
        rgba(255, 145, 200, .055),
        transparent 35%,
        transparent 70%,
        rgba(255, 145, 200, .035)
    );
}

.logo-wrap {
    position: relative;
    display: grid;
    place-items: center;
    width: 108px;
    height: 108px;
    margin: 0 auto 22px;
}

.orbit {
    position: absolute;
    inset: 2px;
    border: 1px solid rgba(255, 145, 200, .65);
    border-radius: 50%;
    animation: rotate 12s linear infinite;
}

.orbit::before,
.orbit::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--pink-light);
    box-shadow: 0 0 12px var(--pink);
}

.orbit::before {
    top: 9px;
    left: 17px;
}

.orbit::after {
    right: 12px;
    bottom: 18px;
}

.orbit.inner {
    inset: 12px;
    border-style: dashed;
    border-color: rgba(255, 145, 200, .35);
    animation: rotate 18s linear infinite reverse;
}

.logo {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 145, 200, .5);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 25%, #462139, #110912 75%);
    box-shadow: 0 0 30px rgba(255, 100, 180, .2),
                inset 0 0 18px rgba(255, 145, 200, .1);
    animation: float 3s ease-in-out infinite;
}

.logo svg {
    width: 57px;
    height: 57px;
    overflow: visible;
    filter: drop-shadow(0 0 7px rgba(255, 145, 200, .5));
}

h1 {
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(21px, 6vw, 28px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.35;
    color: var(--pink-light);
    text-shadow: 0 0 22px rgba(255, 145, 200, .25);
}

.subtitle {
    margin-top: 8px;
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    color: var(--pink);
    font-size: 12px;
    letter-spacing: 5px;
}

.status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    margin: 25px 0;
    padding: 10px;
    border: 1px solid rgba(255, 145, 200, .14);
    border-radius: 30px;
    background: rgba(255, 145, 200, .035);
    color: var(--pink-light);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
}

.dot {
    width: 7px;
    height: 7px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 12px var(--pink);
    animation: pulse 1.4s ease-in-out infinite;
}

.label {
    display: block;
    margin-bottom: 10px;
    color: #f3d6e5;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.7px;
}

.keybox {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 14px 12px;
    border: 1px solid rgba(255, 145, 200, .26);
    border-radius: 12px;
    background: rgba(5, 3, 6, .8);
    transition: border-color .3s, box-shadow .3s;
}

.keybox:focus-within {
    border-color: var(--pink);
    box-shadow: 0 0 20px rgba(255, 145, 200, .1);
}

#key {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--pink-light);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
}

#key::selection {
    background: var(--pink);
    color: #160812;
}

.icon-btn {
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 29px;
    height: 29px;
    border: 1px solid rgba(255, 145, 200, .25);
    border-radius: 8px;
    background: rgba(255, 145, 200, .06);
    color: var(--pink-light);
    cursor: pointer;
    transition: .25s;
}

.icon-btn:hover {
    background: var(--pink);
    color: #160812;
    transform: rotate(-8deg);
}

.copy-btn {
    position: relative;
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .4);
    border-radius: 12px;
    background: linear-gradient(105deg, #e957a1, #ffacd7, #ffd5e9);
    background-size: 200% 100%;
    color: #1a0913;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 5px 25px rgba(230, 79, 156, .17);
    transition: transform .25s, box-shadow .3s;
    animation: buttonGlow 3s ease-in-out infinite;
}

.copy-btn::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -70%;
    width: 35%;
    height: 200%;
    background: rgba(255, 255, 255, .5);
    transform: rotate(25deg);
    transition: left .6s;
}

.copy-btn:hover::before {
    left: 140%;
}

.copy-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 32px rgba(230, 79, 156, .34);
    background-position: 100% 0;
}

.copy-btn:active {
    transform: scale(.97);
}

#message {
    min-height: 18px;
    margin-top: 13px;
    text-align: center;
    color: var(--pink-light);
    font-size: 11px;
    line-height: 1.6;
}

.divider {
    height: 1px;
    margin: 22px 0 17px;
    background: linear-gradient(90deg, transparent, rgba(255, 145, 200, .55), transparent);
}

.footer {
    text-align: center;
    color: #9d8292;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
}

.footer span {
    color: var(--pink);
    text-shadow: 0 0 12px rgba(255, 145, 200, .3);
}

.corner {
    position: absolute;
    width: 13px;
    height: 13px;
    border-color: var(--pink);
    border-style: solid;
    opacity: .8;
}

.tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
.tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
.bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
.br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

@keyframes entrance {
    from { opacity: 0; transform: translateY(28px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-5px) rotate(3deg); }
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.72); }
}

@keyframes scan {
    0% { left: -80%; }
    100% { left: 130%; }
}

@keyframes buttonGlow {
    0%, 100% { box-shadow: 0 5px 20px rgba(230, 79, 156, .15); }
    50% { box-shadow: 0 5px 28px rgba(230, 79, 156, .32); }
}

@keyframes ambient {
    from { transform: translate(0, 0) scale(.9); }
    to { transform: translate(55px, 40px) scale(1.2); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
}

@media (max-width: 390px) {
    .card { padding: 30px 18px 23px; }
    #key { font-size: 10px; }
    h1 { letter-spacing: .3px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>
<canvas id="particles"></canvas>
<div class="ambient one"></div>
<div class="ambient two"></div>

<main class="card" id="card">
    <i class="corner tl"></i>
    <i class="corner tr"></i>
    <i class="corner bl"></i>
    <i class="corner br"></i>

    <div class="logo-wrap">
        <div class="orbit"></div>
        <div class="orbit inner"></div>

        <div class="logo">
            <svg viewBox="0 0 100 100" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="snake" x1="15" y1="10"
                                    x2="85" y2="90">
                        <stop stop-color="#ffd2e9"/>
                        <stop offset=".5" stop-color="#ff91c8"/>
                        <stop offset="1" stop-color="#e64f9c"/>
                    </linearGradient>
                </defs>

                <path d="M65 21 A33 33 0 1 0 80 50"
                      stroke="url(#snake)" stroke-width="9"
                      stroke-linecap="round"/>

                <path d="M64 12 L82 14 L78 31"
                      stroke="#ffd2e9" stroke-width="6"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

                <circle cx="72" cy="17" r="2.4" fill="#170a12"/>

                <path d="M34 36 L50 27 L66 36 L66 55
                         L50 65 L34 55 Z"
                      stroke="#ff91c8" stroke-width="2"
                      fill="rgba(255,145,200,.08)"/>

                <path d="M42 43 L50 38 L58 43 L58 52
                         L50 57 L42 52 Z"
                      fill="#ffd2e9"/>
            </svg>
        </div>
    </div>

    <h1>OUROBOROS HUB</h1>
    <p class="subtitle">KEY SYSTEM</p>

    <div class="status">
        <span class="dot"></span>
        YOUR KEY IS READY
    </div>

    <label class="label" for="key">YOUR ACCESS KEY</label>

    <div class="keybox">
        <input id="key" type="text"
            value="OuroborosHubKeyKalwowj - Kalapwownkeoeneje"
            readonly aria-label="Your access key">

        <button class="icon-btn" id="selectBtn"
            aria-label="Select key" title="Select key">▣</button>
    </div>

    <button class="copy-btn" id="copyBtn">COPY KEY ↗</button>
    <p id="message" role="status" aria-live="polite"></p>

    <div class="divider"></div>

    <p class="footer">POWERED BY <span>OUROBOROS</span></p>
</main>

<script>
const keyInput = document.getElementById('key');
const copyBtn = document.getElementById('copyBtn');
const message = document.getElementById('message');
const card = document.getElementById('card');

document.getElementById('selectBtn').addEventListener('click', () => {
    keyInput.focus();
    keyInput.select();
    message.textContent = 'Key selected. Copy it now.';
});

copyBtn.addEventListener('click', async () => {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(keyInput.value);
        } else {
            keyInput.focus();
            keyInput.select();
            if (!document.execCommand('copy')) {
                throw new Error('Copy unavailable');
            }
        }

        copyBtn.textContent = '✓ KEY COPIED!';
        message.textContent = 'Your key has been copied successfully!';

        setTimeout(() => {
            copyBtn.textContent = 'COPY KEY ↗';
        }, 2200);
    } catch (error) {
        keyInput.focus();
        keyInput.select();
        message.textContent = 'Key selected. Press and hold to copy.';
    }
});

// Animated pink particles
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let width = 0;
let height = 0;
let dpr = 1;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(100, Math.floor(width / 7));
    particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + .4,
        speed: Math.random() * .65 + .15,
        drift: (Math.random() - .5) * .35,
        alpha: Math.random() * .65 + .2,
        phase: Math.random() * Math.PI * 2
    }));
}

let frame = 0;

function animate() {
    ctx.clearRect(0, 0, width, height);
    frame += .015;

    particles.forEach(p => {
        p.y -= p.speed;
        p.x += p.drift + Math.sin(frame + p.phase) * .25;

        if (p.y < -5) {
            p.y = height + 5;
            p.x = Math.random() * width;
        }

        if (p.x < -5) p.x = width + 5;
        if (p.x > width + 5) p.x = -5;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,145,200,${p.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff91c8';
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
resize();
animate();

// Subtle tilt interaction on desktop
if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    card.addEventListener('pointermove', e => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - .5;
        const y = (e.clientY - rect.top) / rect.height - .5;

        card.style.transform =
            `perspective(1000px) rotateX(${-y * 2}deg) rotateY(${x * 2}deg)`;
    });

    card.addEventListener('pointerleave', () => {
        card.style.transform = '';
    });
}

// Gentle click feedback
copyBtn.addEventListener('click', () => {
    card.style.animation = 'none';
    card.style.animation = 'entrance .25s ease';
});
</script>
</body>
</html>
